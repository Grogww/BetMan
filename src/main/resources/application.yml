spring:
  application:
    name: betman
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/betman}
    username: ${DB_USERNAME:betman}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

logging:
  level:
    com.betman: ${BETMAN_LOG_LEVEL:DEBUG}
  pattern:
    level: "%5p [req=%X{requestId:-} user=%X{userId:-}]"

betman:
  simulation:
    enabled: ${BETMAN_SIMULATION_ENABLED:true}
    min-scheduled-events: 8
    match-duration-seconds: 120
    tick-interval-ms: 15000
  odds-provider:
    latency-min-ms: 50
    latency-max-ms: 800
    failure-rate: 0.05
  limits:
    min-stake: 1.00
    max-stake: 10000.00
    min-deposit: 10.00
    max-deposit: 50000.00
    min-withdraw: 10.00
    welcome-bonus: 100.00
