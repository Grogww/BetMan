name: betman

services:
  db:
    image: postgres:16-alpine
    container_name: betman-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-betman}
      POSTGRES_USER: ${DB_USERNAME:-betman}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - betman-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${BETMAN_IMAGE:-ghcr.io/grogww/betman:latest}
    build: .
    container_name: betman-app
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/betman}
      DB_USERNAME: ${DB_USERNAME:-betman}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      SERVER_PORT: ${SERVER_PORT:-8080}
      BETMAN_LOG_LEVEL: ${BETMAN_LOG_LEVEL:-DEBUG}
      BETMAN_SIMULATION_ENABLED: ${BETMAN_SIMULATION_ENABLED:-true}
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    networks:
      - betman-net

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: betman-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - betman-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  betman-net:
    name: betman-net

volumes:
  db-data:
    name: betman-db-data
  prometheus-data:
    name: betman-prometheus-data