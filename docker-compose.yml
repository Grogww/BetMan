name: betman

services:
  db:
    image: postgres:16-alpine
    container_name: betman-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-betman}
      POSTGRES_USER: ${DB_USERNAME:-betman}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - betman-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${BETMAN_IMAGE:-ghcr.io/grogww/betman:latest}
    build: .
    container_name: betman-app
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/betman}
      DB_USERNAME: ${DB_USERNAME:-betman}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      SERVER_PORT: ${SERVER_PORT:-8080}
      BETMAN_LOG_LEVEL: ${BETMAN_LOG_LEVEL:-DEBUG}
      BETMAN_SIMULATION_ENABLED: ${BETMAN_SIMULATION_ENABLED:-true}
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    networks:
      - betman-net

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: betman-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - betman-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

    # Datasource and dashboard provider come from ./grafana/provisioning
  grafana:
    image: grafana/grafana:12.1.1
    container_name: betman-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - betman-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Stores only Graylog metadata (users, inputs, streams), not the logs
  mongodb:
    image: mongo:7.0.14
    container_name: betman-mongodb
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - mongo-data:/data/db
    networks:
      - betman-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Stores and indexes the log messages written by Graylog
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: betman-opensearch
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      action.auto_create_index: "false"
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - betman-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  graylog:
    image: graylog/graylog:6.1.4
    container_name: betman-graylog
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      GRAYLOG_ROOT_USERNAME: ${GRAYLOG_ROOT_USERNAME:-admin}
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?defina GRAYLOG_PASSWORD_SECRET no .env}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?defina GRAYLOG_ROOT_PASSWORD_SHA2 no .env}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:${GRAYLOG_PORT:-9000}/
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_SERVER_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - graylog-data:/usr/share/graylog/data
    ports:
      - "${GRAYLOG_PORT:-9000}:9000"
      - "${GRAYLOG_GELF_PORT:-12201}:12201/udp"
    networks:
      - betman-net
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/lbstatus || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  betman-net:
    name: betman-net

volumes:
  db-data:
    name: betman-db-data
  prometheus-data:
    name: betman-prometheus-data
  grafana-data:
    name: betman-grafana-data
  mongo-data:
    name: betman-mongo-data
  opensearch-data:
    name: betman-opensearch-data
  graylog-data:
    name: betman-graylog-data